services:
  - type: web
    name: tradesense-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        value: sqlite:///tradesense.db
      - key: SECRET_KEY
        generateValue: true
